<html lang="en">
<head>

.tab{border-radius:6px 6px 0 0}.tab.on{background:var(--bg);color:var(--ac);font-weight:600;border-color:var(--ln)}
.dz{outline:3px dashed var(--ac);outline-offset:-3px}
</style>
</head>

</div>

async function openFile(f){try{const n=f.name,buf=await f.arrayBuffer(),u=new Uint8Array(buf,0,Math.min(4,buf.byteLength)),zip=(u[0]===80&&u[1]===75)||(u[0]===208&&u[1]===207),base=n.replace(/\.(tabula\.json|tabula|json|csv|tsv|txt|xlsx|xlsm|xlsb|xls|ods|fods|html?)$/i,''),xml=/\.(fods|html?)$/i.test(n);let doc;

mut(()=>{S=doc;sel={r:0,c:0,r2:0,c2:0}});dirty=0;$('dn').value=S.name;sc.scrollTop=sc.scrollLeft=0;paint();say(bad?'Opened '+n+' – checksum mismatch: the file may have been edited or damaged':'Opened '+n)}catch(e){say('Could not open '+f.name+': '+(e.message||e))}}
/* ---------- state ---------- */
let S,sel,UD=[],RD=[],ed=0,dirty=0,clip,drag=0,rz=null,tick=0,pt;
const blank=()=>({name:'Untitled spreadsheet',act:0,sheets:[mkS('Sheet1')]});
const cur=()=>S.sheets[S.act],W=c=>cur().w[c]||DW,nr=s=>Math.max(100,s.d.length+30);
const colX=c=>{let x=0;for(let i=0;i<c;i++)x+=W(i);return x};
const nsel=()=>({r1:Math.min(sel.r,sel.r2),r2:Math.max(sel.r,sel.r2),c1:Math.min(sel.c,sel.c2),c2:Math.max(sel.c,sel.c2)});
const rawOf=(s,r,c)=>{const x=s.d[r];return x?x[c]:undefined};
const rawText=(s,r,c)=>{const v=rawOf(s,r,c);return v==null?'':v===true?'TRUE':v===false?'FALSE':String(v)};
function persist(){clearTimeout(pt);pt=setTimeout(()=>{try{localStorage.setItem('tabula.draft',tabStr())}catch(e){}},700)}
function mut(fn){UD.push(JSON.stringify(S));while(UD.length>40||UD.reduce((n,x)=>n+x.length,0)>6e7)UD.shift();RD=[];fn();touch()}
function touch(){S.sheets.forEach(s=>{s.m=new Map();let n=0;for(const r of s.d)if(r&&r.length>n)n=r.length;s.nc=Math.max(26,n+3)});if(cc.size>5e4)cc.clear();dirty=1;persist();full()}
function swap(from,to){if(!from.length)return say('Nothing to '+(from===UD?'undo':'redo'));to.push(JSON.stringify(S));S=JSON.parse(from.pop());S.act=Math.min(S.act,S.sheets.length-1);$('dn').value=S.name;touch()}
const undo=()=>{endEdit(0);swap(UD,RD)},redo=()=>{endEdit(0);swap(RD,UD)};
function setRaw(s,r,c,v){if(v===''&&rawOf(s,r,c)==null)return;while(s.d.length<=r)s.d.push([]);s.d[r][c]=v;delete s.k[r+','+c]}
function commit(t){const v=parse(t);if(v===(rawOf(cur(),sel.r,sel.c)??''))return;mut(()=>setRaw(cur(),sel.r,sel.c,v))}
function clearSel(){const s=cur(),q=nsel();mut(()=>{for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)setRaw(s,r,c,'')})}
function bold(){const s=cur(),q=nsel();let all=true;for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)if(!s.b[r+','+c])all=false;mut(()=>{for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)all?delete s.b[r+','+c]:s.b[r+','+c]=1})}
function shift(s,ax,at,dl){const f=(c,r)=>{let p=ax?c:r;if(dl>0){if(p>=at)p++}else{if(p===at)return null;if(p>at)p--}return ax?[p,r]:[c,p]};
s.d.forEach(row=>row&&row.forEach((v,c)=>{if(typeof v==='string'&&v[0]==='=')row[c]=mapRefs(v,f)}));
['b','k'].forEach(x=>{const o={};for(const key in s[x]){const[r,c]=key.split(',').map(Number),n=f(c,r);if(n)o[n[1]+','+n[0]]=s[x][key]}s[x]=o});

else dl>0?s.d.splice(at,0,[]):s.d.splice(at,1)}
function ops(ax,del){endEdit(1);const s=cur(),q=nsel(),at=ax?q.c1:q.r1,n=ax?q.c2-q.c1+1:q.r2-q.r1+1;if(n>=(ax?s.nc:nr(s)))return say('Select a cell, row or column first');
mut(()=>{for(let i=0;i<n;i++)shift(s,ax,at,del?-1:1);if(del)sel={r:q.r1,c:q.c1,r2:q.r1,c2:q.c1}})}
const uniq=(n,ex)=>{n=n.replace(/[\[\]:*?\/\\]/g,'_').slice(0,31)||'Sheet';let x=n,i=1;while(S.sheets.some((s,j)=>j!==ex&&s.n.toLowerCase()===x.toLowerCase()))x=n.slice(0,27)+' '+ ++i;return x};
function addSheet(){mut(()=>{S.sheets.push(mkS(uniq('Sheet'+(S.sheets.length+1),-1)));S.act=S.sheets.length-1;sel={r:0,c:0,r2:0,c2:0}})}
function delSheet(){if(S.sheets.length<2)return;mut(()=>{S.sheets.splice(S.act,1);S.act=Math.max(0,S.act-1);sel={r:0,c:0,r2:0,c2:0}})}
/* ---------- rendering ---------- */
function full(){tabs();paint()}
function tabs(){$('tabs').innerHTML=S.sheets.map((s,i)=>'<button class="tab'+(i===S.act?' on':'')+'" data-i='+i+'>'+esc(s.n)+'</button>').join('')+'<button data-i=add title="Add sheet">＋</button>'+(S.sheets.length>1?'<button data-i=del title="Delete current sheet">Delete sheet</button>':'')}
function paint(){const s=cur(),n=nr(s),C=s.nc,q=nsel(),top=sc.scrollTop,vh=sc.clientHeight||600,r0=Math.max(0,Math.floor(top/RH)-4),r1=Math.min(n,Math.ceil((top+vh)/RH)+4),sp=h=>'<tr><td colspan="'+(C+1)+'" style="height:'+h+'px;padding:0;border:0"></td></tr>';
let h='<colgroup><col style="width:'+HW+'px">',tw=HW;for(let c=0;c<C;c++){const w=W(c);h+='<col style="width:'+w+'px">';tw+=w}
h+='</colgroup><thead><tr><th class=c0 data-r=-1 data-c=-1></th>';
for(let c=0;c<C;c++)h+='<th data-r=-1 data-c='+c+(c>=q.c1&&c<=q.c2?' class=hl':'')+'>'+A(c)+'<i class=rz data-c='+c+'></i></th>';
h+='</tr></thead><tbody>';if(r0)h+=sp(r0*RH);
for(let r=r0;r<r1;r++){const ri=r>=q.r1&&r<=q.r2;h+='<tr><th class="rh'+(ri?' hl':'')+'" data-r='+r+' data-c=-1>'+(r+1)+'</th>';
for(let c=0;c<C;c++){const v=val(s,r,c),k=(typeof v==='number'?'n ':v instanceof Er?'e ':'')+(s.b[r+','+c]?'b ':'')+(ri&&c>=q.c1&&c<=q.c2?r===sel.r&&c===sel.c?'a':'s':'');
h+='<td data-r='+r+' data-c='+c+(k?' class="'+k+'"':'')+'>'+esc(v instanceof Er?v.m:toS(v))+'</td>'}h+='</tr>'}
if(n>r1)h+=sp((n-r1)*RH);
g.style.width=tw+'px';g.innerHTML=h+'</tbody>';
$('ad').value=A(sel.c)+(sel.r+1);if(document.activeElement!==$('fx'))$('fx').value=rawText(s,sel.r,sel.c);$('un').disabled=!UD.length;$('re').disabled=!RD.length}
function reveal(r,c){const x=colX(c),w=W(c),y=r*RH,vw=sc.clientWidth,vh=sc.clientHeight;
if(y<sc.scrollTop)sc.scrollTop=y;else if(y+2*RH>sc.scrollTop+vh)sc.scrollTop=y+2*RH-vh;
if(x<sc.scrollLeft)sc.scrollLeft=x;else if(x+w+HW>sc.scrollLeft+vw)sc.scrollLeft=x+w+HW-vw}
function mv(dr,dc,x){const s=cur(),n=nr(s),C=s.nc,cl=(v,m)=>Math.max(0,Math.min(m-1,v));
if(x){sel.r2=cl(sel.r2+dr,n);sel.c2=cl(sel.c2+dc,C)}else{const r=cl(sel.r+dr,n),c=cl(sel.c+dc,C);sel={r,c,r2:r,c2:c}}
reveal(x?sel.r2:sel.r,x?sel.c2:sel.c);paint()}
function startEdit(init){if(ed)return;const s=cur(),e=$('ed');reveal(sel.r,sel.c);ed=1;e.style.display='block';e.style.left=HW+colX(sel.c)+'px';e.style.top=RH+sel.r*RH+'px';e.style.width=Math.max(W(sel.c),120)+'px';e.value=init!=null?init:rawText(s,sel.r,sel.c);e.focus();e.setSelectionRange(e.value.length,e.value.length)}
function endEdit(save){if(!ed)return;ed=0;const e=$('ed'),v=e.value;e.style.display='none';if(save)commit(v)}
/* ---------- clipboard ---------- */
function cp(e,cut){const s=cur(),q=nsel(),L=[],B=[];for(let r=q.r1;r<=q.r2;r++){const a=[],b=[];for(let c=q.c1;c<=q.c2;c++){const v=val(s,r,c),t=v instanceof Er?v.m:toS(v);a.push(/[\t\n"]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t);const x=rawOf(s,r,c);b.push(x==null?'':x)}L.push(a.join('\t'));B.push(b)}
const txt=L.join('\n');e.clipboardData.setData('text/plain',txt);clip={txt,raws:B,r:q.r1,c:q.c1};if(cut)clearSel()}
function ps(t){const s=cur(),q=nsel(),rel=clip&&t===clip.txt,src=rel?clip.raws:csv(t,'\t').map(r=>r.map(v=>parse(v,1)));if(!src.length)return;
const h=src.length,w=Math.max(...src.map(r=>r.length)),one=h===1&&w===1,R2=one?q.r2:q.r1+h-1,C2=one?q.c2:q.c1+w-1;
mut(()=>{for(let r=q.r1;r<=R2;r++)for(let c=q.c1;c<=C2;c++){const si=one?0:r-q.r1,sj=one?0:c-q.c1;let v=src[si][sj];if(v===undefined)v='';
if(rel&&typeof v==='string'&&v[0]==='='){const dr=r-(clip.r+si),dc=c-(clip.c+sj);v=mapRefs(v,(cc_,rr,ac,ar)=>{const x=ac?cc_:cc_+dc,y=ar?rr:rr+dr;return x<0||y<0?null:[x,y]})}
setRaw(s,r,c,v)}sel={r:q.r1,c:q.c1,r2:R2,c2:C2}})}
/* ---------- events ---------- */
const inFld=e=>/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
document.addEventListener('copy',e=>{if(inFld(e))return;e.preventDefault();cp(e,0)});
document.addEventListener('cut',e=>{if(inFld(e))return;e.preventDefault();cp(e,1)});
document.addEventListener('paste',e=>{if(inFld(e))return;e.preventDefault();ps(e.clipboardData.getData('text/plain'))});
document.addEventListener('keydown',e=>{const k=e.key,m=e.ctrlKey||e.metaKey;
if(m&&k.toLowerCase()==='s'){e.preventDefault();saveNative();return}

if(m){const l=k.toLowerCase();if(l==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(l==='y'){e.preventDefault();redo()}else if(l==='b'){e.preventDefault();bold()}else if(l==='a'){e.preventDefault();const s=cur();sel={r:0,c:0,r2:nr(s)-1,c2:s.nc-1};paint()}return}
if(e.altKey)return;

else if(k==='Enter'||k==='F2'){e.preventDefault();startEdit()}
else if(k==='Tab'){e.preventDefault();mv(0,e.shiftKey?-1:1)}
else if(k==='Delete'||k==='Backspace'){e.preventDefault();clearSel()}
else if(k.length===1){e.preventDefault();startEdit(k)}});
$('ed').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();endEdit(1);mv(e.shiftKey?-1:1,0)}else if(e.key==='Tab'){e.preventDefault();endEdit(1);mv(0,e.shiftKey?-1:1)}else if(e.key==='Escape'){endEdit(0);sc.focus()}};
$('ed').onblur=()=>endEdit(1);
$('fx').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit($('fx').value);e.target.blur();mv(1,0);sc.focus()}else if(e.key==='Escape'){e.target.blur();paint();sc.focus()}};
g.onmousedown=e=>{if(e.button)return;const t=e.target.closest('[data-c]');if(!t)return;endEdit(1);const c=+t.dataset.c,r=+t.dataset.r,s=cur();

if(r<0&&c<0)sel={r:0,c:0,r2:nr(s)-1,c2:s.nc-1};else if(r<0)sel={r:0,c,r2:nr(s)-1,c2:c};else if(c<0)sel={r,c:0,r2:r,c2:s.nc-1};
else{if(e.shiftKey){sel.r2=r;sel.c2=c}else sel={r,c,r2:r,c2:c};drag=1}
e.preventDefault();paint();if(e.detail===2&&r>=0&&c>=0)startEdit();else sc.focus()};
addEventListener('mousemove',e=>{if(rz){cur().w[rz.c]=Math.max(30,rz.w+e.clientX-rz.x);paint();return}if(!drag)return;const t=document.elementFromPoint(e.clientX,e.clientY),td=t&&t.closest&&t.closest('td[data-c]');if(td){const r=+td.dataset.r,c=+td.dataset.c;if(r!==sel.r2||c!==sel.c2){sel.r2=r;sel.c2=c;paint()}}});
addEventListener('mouseup',()=>{if(rz){dirty=1;persist()}rz=null;drag=0});
sc.onscroll=()=>{if(!tick){tick=1;requestAnimationFrame(()=>{tick=0;paint()})}};
addEventListener('resize',paint);
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=b.dataset.i;endEdit(1);if(i==='add')addSheet();else if(i==='del')delSheet();else if(+i!==S.act){S.act=+i;sel={r:0,c:0,r2:0,c2:0};sc.scrollTop=sc.scrollLeft=0;full()}};
$('tabs').ondblclick=e=>{const b=e.target.closest('.tab');if(!b)return;const i=+b.dataset.i,inp=document.createElement('input');inp.value=S.sheets[i].n;inp.size=14;b.replaceWith(inp);inp.focus();inp.select();let fin=0;const done=ok=>{if(fin)return;fin=1;ok&&inp.value.trim()?mut(()=>{S.sheets[i].n=uniq(inp.value.trim(),i)}):full()};inp.onblur=()=>done(1);inp.onkeydown=ev=>{if(ev.key==='Enter')done(1);else if(ev.key==='Escape')done(0)}};
$('nw').onclick=()=>{endEdit(1);mut(()=>{S=blank();sel={r:0,c:0,r2:0,c2:0}});dirty=0;$('dn').value=S.name};
$('op').onclick=()=>$('fi').click();
$('fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)};
$('sv').onclick=saveNative;$('ex').onchange=e=>exportAs(e.target.value);
$('un').onclick=undo;$('re').onclick=redo;$('bd').onclick=bold;
$('ir').onclick=()=>ops(0,0);$('ic').onclick=()=>ops(1,0);$('dr').onclick=()=>ops(0,1);$('dc').onclick=()=>ops(1,1);
$('tb').addEventListener('click',()=>setTimeout(()=>{if(document.activeElement.tagName==='BUTTON')sc.focus()}));
$('dn').oninput=()=>{S.name=$('dn').value;dirty=1;persist()};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dz')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dz')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dz');const f=e.dataTransfer.files[0];if(f)openFile(f)});

/* ---------- boot ---------- */
try{const t=localStorage.getItem('tabula.draft');if(t){S=fromTab(JSON.parse(t));delete S.bad}}catch(e){S=0}
if(S)say('Restored your last session');else S=blank();
$('dn').value=S.name;sel={r:0,c:0,r2:0,c2:0};full();sc.focus();setTimeout(paint,60);
