name = "scribae-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "scribae"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

[vars]
# Your site's origin(s), comma-separated. Scheme and host only: no path, no trailing slash.
ALLOWED_ORIGINS = "https://YOURNAME.github.io"

[triggers]
# Hourly check for scheduled credit grants and key delivery.
crons = ["0 * * * *"]
